app:
  name: Banking Product Intelligence Extraction System
  log_file: logs/system.log

documents:
  supported_file_types:
    - .json
    - .pdf
    - .docx
    - .txt

chunking:
  chunk_size: 1600
  overlap: 250

embeddings:
  backend: hashing
  model_name: BAAI/bge-large-en-v1.5
  batch_size: 16

qdrant:
  collection_name: banking_product_chunks
  recreate_collection: false

retrieval:
  top_k: 8

confidence:
  threshold: 0.75

outputs:
  products_xlsx: output/nbo_master_dataset.xlsx
  review_xlsx: output/nbo_review_required.xlsx
  trace_jsonl: output/extraction_trace.jsonl

schema:
  columns:
    - PRODUCT_NAME
    - LEAD_CO_MNE
    - SOURCE_FILE_PRODUCT
    - PLAN_TYPE
    - TARGET_GOAL
    - CUSTOMER_TYPE
    - EMPLOYMENT_TYPE
    - CUSTOMER_SEGMENT
    - TARGET_SEGMENT
    - SEGMENT
    - MIN_AGE
    - MAX_AGE
    - GENDER
    - BANK_CUSTOMER
    - ACCOUNT_TYPE
    - CARD_TYPE
    - CHANNEL
    - ELIGIBILITY_TYPE
    - SERVICE_TYPE
    - REWARD_TYPE
    - CURRENCY
    - CURRENCY_TYPE
    - MIN_BALANCE
    - AVG_BALANCE_REQUIREMENT
    - MIN_INCOME
    - MIN_INCOME_USD
    - MIN_INVESTMENT
    - MIN_CONTRIBUTION
    - LOAN_AMOUNT_RANGE
    - COVERAGE_AMOUNT
    - FINANCING_TYPE
    - PROFIT_TYPE
    - PROFIT_FREQUENCY
    - TENURE
    - TENURE_OPTIONS
    - MIN_TERM_YEARS
    - MAX_TERM_YEARS
    - BUSINESS_TENURE
    - COLLATERAL_TYPE
    - EQUITY_REQUIREMENT
    - DBR_LIMIT
    - TRANSACTION_LIMIT
    - SPECIAL_CONDITIONS

extraction_groups:
  identity:
    - PRODUCT_NAME
    - LEAD_CO_MNE
    - SOURCE_FILE_PRODUCT
    - PLAN_TYPE
    - TARGET_GOAL
  customer:
    - CUSTOMER_TYPE
    - EMPLOYMENT_TYPE
    - CUSTOMER_SEGMENT
    - TARGET_SEGMENT
    - SEGMENT
    - MIN_AGE
    - MAX_AGE
    - GENDER
    - BANK_CUSTOMER
  product_features:
    - ACCOUNT_TYPE
    - CARD_TYPE
    - CHANNEL
    - ELIGIBILITY_TYPE
    - SERVICE_TYPE
    - REWARD_TYPE
    - CURRENCY
    - CURRENCY_TYPE
  financials:
    - MIN_BALANCE
    - AVG_BALANCE_REQUIREMENT
    - MIN_INCOME
    - MIN_INCOME_USD
    - MIN_INVESTMENT
    - MIN_CONTRIBUTION
    - LOAN_AMOUNT_RANGE
    - COVERAGE_AMOUNT
  financing_terms:
    - FINANCING_TYPE
    - PROFIT_TYPE
    - PROFIT_FREQUENCY
    - TENURE
    - TENURE_OPTIONS
    - MIN_TERM_YEARS
    - MAX_TERM_YEARS
    - BUSINESS_TENURE
    - COLLATERAL_TYPE
    - EQUITY_REQUIREMENT
    - DBR_LIMIT
    - TRANSACTION_LIMIT
    - SPECIAL_CONDITIONS
